<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCP 경마장</title>
<style>
  :root { --bg:#0f1a12; --turf:#1d3b24; --turf2:#22452a; --line:#e8e2c9; --text:#f4f1e6; --muted:#a9b3a2; --gold:#f2c14e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  header { display:flex; align-items:baseline; justify-content:space-between; gap:16px; padding:20px 28px 8px; flex-wrap:wrap; }
  h1 { margin:0; font-size:clamp(22px,3vw,36px); letter-spacing:-0.02em; }
  #phase { font-size:clamp(16px,2vw,24px); font-weight:700; padding:6px 14px; border-radius:999px; background:#2b3a2e; }
  #phase.racing { background:#b3261e; animation:pulse 1s infinite alternate; }
  #phase.finished { background:var(--gold); color:#222; }
  @keyframes pulse { to { filter:brightness(1.3); } }
  main { display:grid; grid-template-columns: 1fr 280px; gap:20px; padding:12px 28px 28px; }
  @media (max-width:900px){ main { grid-template-columns:1fr; } }
  .track { border:3px solid var(--line); border-radius:14px; overflow:hidden; align-self:start; }
  .lane { position:relative; height:var(--lane-h,52px); display:flex; align-items:center; border-bottom:1px dashed rgba(232,226,201,.35); }
  .lane:nth-child(odd){ background:var(--turf); } .lane:nth-child(even){ background:var(--turf2); }
  .lane:last-child { border-bottom:none; }
  .finish { position:absolute; right:56px; top:0; bottom:0; width:10px;
            background:repeating-linear-gradient(0deg,#fff 0 8px,#111 8px 16px); opacity:.9; }
  .runner { position:absolute; left:0; transition:left .6s cubic-bezier(.3,1.4,.5,1); display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .runner .h { font-size:calc(var(--lane-h,52px) * .7); transform:scaleX(-1); display:inline-block; }
  .lane .n { position:absolute; left:0; top:0; bottom:0; width:110px; display:flex; align-items:center; padding:0 10px; font-weight:700; font-size:clamp(12px,1.4vw,16px); background:rgba(0,0,0,.3); overflow:hidden; text-overflow:ellipsis; z-index:1; }
  .rankbadge { position:absolute; right:8px; font-size:26px; }
  aside { display:flex; flex-direction:column; gap:16px; }
  .card { background:#17261a; border:1px solid #2e4433; border-radius:12px; padding:14px 16px; }
  .card h2 { margin:0 0 8px; font-size:15px; color:var(--muted); font-weight:600; }
  ol { margin:0; padding-left:22px; } li { margin:4px 0; }
  #log div { font-size:14px; padding:3px 0; color:var(--muted); }
  #log div:last-child { color:var(--text); }
  .how { font-size:14px; line-height:1.6; color:var(--muted); } .how b { color:var(--text); }
  .empty { padding:40px; text-align:center; color:var(--muted); font-size:20px; }
</style>
</head>
<body>
<header>
  <h1>🏇 MCP 경마장</h1>
  <div id="phase">대기 중</div>
</header>
<main>
  <div class="track" id="track"><div class="empty">ChatGPT에서 "경주 참가할래, 닉네임은 ○○" 라고 말해보세요</div></div>
  <aside>
    <div class="card"><h2>🏆 순위</h2><ol id="rank"></ol></div>
    <div class="card"><h2>📣 중계</h2><div id="log"></div></div>
    <div class="card how">
      <b>1.</b> ChatGPT에 경마 커넥터 추가<br>
      <b>2.</b> "닉네임 ○○으로 참가"<br>
      <b>3.</b> 출발 신호 후 <b>"전진!"</b> 연타<br>
      <span style="font-size:12px">말은 3초에 한 번만 달릴 수 있어요</span>
    </div>
  </aside>
</main>
<script>
const PHASE = { lobby:"참가 접수 중", racing:"🔥 경주 중!", finished:"🏁 경주 종료" };
const medal = r => ["🥇","🥈","🥉"][r-1] || (r ? r+"등" : "");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lanes = new Map();

function render(s) {
  const ph = document.getElementById("phase");
  ph.textContent = PHASE[s.phase]; ph.className = s.phase;
  const track = document.getElementById("track");
  if (!s.players.length) { track.innerHTML = '<div class="empty">ChatGPT에서 "경주 참가할래, 닉네임은 ○○" 라고 말해보세요</div>'; lanes.clear(); return; }
  if (track.querySelector(".empty")) track.innerHTML = "";
  const laneH = Math.max(28, Math.min(64, Math.floor((window.innerHeight - 160) / s.players.length)));
  track.style.setProperty("--lane-h", laneH + "px");
  const names = new Set(s.players.map(p => p.name));
  for (const [n, el] of lanes) if (!names.has(n)) { el.remove(); lanes.delete(n); }
  for (const p of s.players) {
    let el = lanes.get(p.name);
    if (!el) {
      el = document.createElement("div"); el.className = "lane";
      el.innerHTML = '<div class="finish"></div><span class="n"></span><div class="runner"><span class="h"></span></div><div class="rankbadge"></div>';
      track.appendChild(el); lanes.set(p.name, el);
    }
    el.querySelector(".h").textContent = p.horse;
    el.querySelector(".n").textContent = p.name;
    const h = laneH * 0.8, start = 116, end = track.clientWidth - 62 - h;
    el.querySelector(".runner").style.left = (start + (end - start) * p.pos / s.trackLength) + "px";
    el.querySelector(".rankbadge").textContent = medal(p.rank);
  }
  const sorted = [...s.players].sort((a,b) => (a.rank||99) - (b.rank||99) || b.pos - a.pos);
  document.getElementById("rank").innerHTML = sorted.slice(0,10).map(p => `<li>${esc(p.horse)} ${esc(p.name)} <span style="color:var(--muted)">${p.rank ? medal(p.rank) : p.pos+"m"}</span></li>`).join("");
  document.getElementById("log").innerHTML = s.log.map(l => `<div>${esc(l)}</div>`).join("");
}
let last;
const es = new EventSource("/events");
es.onmessage = e => { last = JSON.parse(e.data); render(last); };
window.addEventListener("resize", () => last && render(last));
</script>
</body>
</html>
